# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
name: CI Coherence Hibernate
run-name: ${{ github.event.head_commit.message }} [${{ github.event_name }}][${{ github.ref_name }}]
on:
  push:
    branches:
      - main
      - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
      - main
      - '[1-9]+.[0-9]+.x'
  workflow_dispatch:
jobs:
  build:
    # The Java 17 non-PR leg also updates NVD; use the same group as PRs and warm-up.
    concurrency:
      group: ${{ github.event_name != 'pull_request' && matrix.java-version == '17' && 'dependency-check-nvd' || format('build-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.java-version) }}
      queue: max
      cancel-in-progress: false
    strategy:
      matrix:
        java-version: [ '17', '21', '25' ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
    - name: Cache Maven packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-jdk-${{ matrix.java-version }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-
    - name: Build - Hibernate 7.4.x on Java ${{ matrix.java-version }}
      run: ./mvnw clean verify -B -Pcoverage
    - name: Verify Java 17 bytecode baseline
      run: |
        javap -verbose coherence-hibernate-cache-7/target/classes/com/oracle/coherence/hibernate/cache/v7/CoherenceRegionFactory.class | grep -q 'major version: 61'
    - name: Run cache-store demo on Java ${{ matrix.java-version }}
      run: java -jar samples/coherence-hibernate-cache-store-demo/target/coherence-hibernate-cache-store-demo.jar
    - name: Analyze Hibernate 7.4.x build with Sonar
      if: "vars.SONAR_ENABLED == 'true' && github.repository == 'coherence-community/coherence-hibernate' && github.event_name != 'pull_request' && matrix.java-version == '17'"
      run: |
        git config --global user.email "github-action@users.noreply.github.com"
        git config --global user.name "GitHub Action"
        ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=coherence-community_coherence-hibernate -Dsonar.branch.name=${{ env.GITHUB_REF_NAME }} -B
      env:
        MAVEN_GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        SONAR_TOKEN: "${{secrets.SONAR_TOKEN}}"
    - name: Prepare vulnerability database
      if: "github.event_name != 'pull_request' && matrix.java-version == '17'"
      uses: ./.github/actions/dependency-check-data
      with:
        nvd-api-key: ${{ secrets.NVD_API_KEY }}
    - name: Check dependencies for known vulnerabilities
      if: "github.event_name != 'pull_request' && matrix.java-version == '17'"
      run: ./mvnw verify -B -DskipTests -Powasp -DdataDirectory="$HOME/.cache/dependency-check" -DautoUpdate=false
    - name: Build and deploy website and snapshots
      if: "github.repository == 'coherence-community/coherence-hibernate' && github.event_name != 'pull_request' && matrix.java-version == '17'"
      run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          ./mvnw deploy -B -DskipTests --settings .mvn/settings.xml
      env:
        MAVEN_GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        MAVEN_SONATYPE_USERNAME: "${{secrets.MAVEN_SONATYPE_USERNAME}}"
        MAVEN_SONATYPE_TOKEN: "${{secrets.MAVEN_SONATYPE_TOKEN}}"
    - name: Clean Maven cache
      run: |
        find ~/.m2/repository -type d -name '*SNAPSHOT' | xargs rm -fr

  compatibility:
    name: Hibernate ${{ matrix.hibernate-version }} / Coherence ${{ matrix.coherence-version }} / Java 17
    if: github.ref_name == 'main' || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        hibernate-version: [ '7.4.1.Final', '7.4.5.Final' ]
        coherence-version: [ '15.1.1-0-5', '26.07' ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Cache Maven packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-jdk-17-hibernate-${{ matrix.hibernate-version }}-coherence-${{ matrix.coherence-version }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-
    - name: Test Hibernate ${{ matrix.hibernate-version }} with Coherence ${{ matrix.coherence-version }}
      run: >
        ./mvnw -B
        -pl coherence-hibernate-cache-7,coherence-hibernate-cache-store-tests
        -am
        -Dhibernate7.version=${{ matrix.hibernate-version }}
        -Dcoherence.version=${{ matrix.coherence-version }}
        test
