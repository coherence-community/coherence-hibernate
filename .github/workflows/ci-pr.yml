name: CI - Pull Request
on:
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        java-version: [ 17, 21 ]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        name: 📥 Checkout repository
        with:
          fetch-depth: 0
      - name: 🔧 Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
      - name: 🫙 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: 🛠 Build and test with ☕ Java ${{ matrix.java-version }}
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          ./mvnw clean install -B -Pjdk${{ matrix.java-version }}
        env:
          GIT_COMMIT: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
      - name: Check dependencies for known vulnerabilities
        if: matrix.java-version == 17
        run: ./mvnw verify -B -DskipTests -Powasp
        env:
          NVD_API_KEY: "${{secrets.NVD_API_KEY}}"
      - name: Publish dependency-check reports
        if: always() && matrix.java-version == 17
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports-java-17
          path: target/dependency-check-report.*
          if-no-files-found: ignore
      - name: 📊 Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Java CI / Test Report (${{ matrix.java-version }})
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_retries: 'true'
      - name: 🧹 Clean Maven cache
        run: |
          find ~/.m2/repository -type d -name '*SNAPSHOT' -prune -exec rm -rf {} +
